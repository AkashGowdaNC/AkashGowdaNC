      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="0.40" stop-color="#FFB020"/>
      <stop offset="0.50" stop-color="#FFF6DC"/>
      <stop offset="0.60" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#FF6B35"/>
      <animate attributeName="x1" values="-60%;140%" dur="7s" repeatCount="indefinite"
