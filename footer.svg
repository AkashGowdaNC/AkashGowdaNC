<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-label="Footer - Akash Gowda N C - contact">

  <defs>
    <linearGradient id="fEmber" x1="-60%" x2="10%" y1="0%" y2="0%">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="0.42" stop-color="#FFB020"/>
      <stop offset="0.5" stop-color="#FFF6DC"/>
      <stop offset="0.58" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#FF6B35"/>
      <animate attributeName="x1" values="-60%;140%" dur="6s" repeatCount="indefinite"
