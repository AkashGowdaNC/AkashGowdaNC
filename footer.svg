      <animate attributeName="x2" values="10%;210%" dur="6s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.45 0 0.55 1"/>
    </linearGradient>

    <linearGradient id="fRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFB020" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fFade" x1="0" y1="0" x2="1" y2="0">
