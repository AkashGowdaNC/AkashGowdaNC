      <stop offset="0.12" stop-color="#05070D" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#05070D" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070D" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="fGlow" cx="50%" cy="115%" r="70%">
