<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 60" width="1100" height="60" role="img" aria-label="section divider">

  <defs>
    <linearGradient id="dBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFB020" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="0.5" stop-color="#FFF6DC"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>

    <radialGradient id="dGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>

    <filter id="dSoft" x="-100%" y="-400%" width="300%" height="900%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="1100" height="60" fill="#05070D"/>
  <rect width="1100" height="60" fill="url(#dGlow)"/>

  <rect x="0" y="29.2" width="1100" height="1.4" fill="url(#dBase)"/>

  <rect x="0" y="28.8" width="150" height="2.2" rx="1.1" fill="url(#dPulse)" filter="url(#dSoft)">
    <animate attributeName="x" values="-150;1100" dur="4.5s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.45 0 0.55 1"/>
  </rect>

  <g fill="#FFB020">
    <rect x="516" y="26" width="7" height="7" transform="rotate(45 519.5 29.5)" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="546" y="25" width="9" height="9" transform="rotate(45 550.5 29.5)" fill="#FF6B35" opacity="1">
      <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="578" y="26" width="7" height="7" transform="rotate(45 581.5 29.5)" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="#FFB020" fill-opacity="0.3">
    <rect x="120" y="25" width="1" height="9"/>
    <rect x="180" y="25" width="1" height="9"/>
    <rect x="240" y="25" width="1" height="9"/>
    <rect x="860" y="25" width="1" height="9"/>
    <rect x="920" y="25" width="1" height="9"/>
    <rect x="980" y="25" width="1" height="9"/>
  </g>

</svg>
